name: Test invalid file extension error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid file extension
        id: action
        uses: .
        with:
          apikey: 'dummy-api-key-not-used'
          inputFiles: 'README.exe'
          outputFiles: 'README.{ja}.exe'
          languages: 'Japanese'
        continue-on-error: true
      - name: Assert action failed due to invalid extension
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid file extension, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid file extension"
