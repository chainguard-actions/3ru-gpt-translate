name: Test invalid file extension fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid file extension in inputFiles
        id: action
        uses: .
        with:
          apikey: fake-api-key-for-testing
          provider: openai
          inputFiles: 'README.txt'
          outputFiles: 'README-ja.txt'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed due to invalid file extension
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid file extension, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid file extension"
