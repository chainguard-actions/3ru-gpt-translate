name: Test invalid file extension rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid file extension (.txt is not supported)
        id: action
        uses: .
        with:
          apikey: 'sk-fake-key-for-ext-test'
          inputFiles: 'README.txt'
          outputFiles: 'README.ja.txt'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed due to invalid extension
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when invalid file extension (.txt) is provided, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid file extension"
