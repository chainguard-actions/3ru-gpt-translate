name: Test - Invalid File Extension
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run GPT Translate with invalid file extension
        id: action
        # The action only supports .md, .mdx, and .json files.
        # Providing a .txt file should cause a validation error.
        uses: .
        with:
          token: 'fake-token'
          apikey: 'fake-api-key'
          inputFiles: 'README.txt'
          outputFiles: 'README.ja.txt'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed with validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid file extension (.txt), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid file extension"
