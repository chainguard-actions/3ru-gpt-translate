name: Test GPT Translate - Invalid File Extension
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: owner/repo
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When inputFiles contains an unsupported file extension (e.g. .exe),
      # extractInput() throws an error and the action fails.
      - id: action
        uses: .
        continue-on-error: true
        with:
          apikey: fake-api-key-not-used
          token: dummy-github-token
          inputFiles: README.exe
          outputFiles: README.{ja}.exe
          languages: Japanese

      - name: Assert action failed due to invalid file extension
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid file extension, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid file extension"
