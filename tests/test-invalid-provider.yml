name: Test invalid provider fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test markdown file to translate
        run: |
          mkdir -p tests/fixtures
          echo "# Hello World" > tests/fixtures/test-input.md

      - name: Run action with unsupported provider
        id: action
        uses: .
        with:
          apikey: fake-api-key-for-testing
          provider: unsupported-provider-xyz
          inputFiles: 'tests/fixtures/test-input.md'
          outputFiles: 'tests/fixtures/test-output-{ja}.md'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed with unsupported provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unsupported provider, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported provider"
