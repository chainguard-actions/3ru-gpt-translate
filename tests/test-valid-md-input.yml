name: Test valid markdown input (fails at API call)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample markdown file to translate
        run: |
          echo "# Hello World" > /tmp/sample.md
          echo "This is a test document." >> /tmp/sample.md

      - name: Run action with valid .md file and dummy API key
        id: action
        uses: .
        with:
          apikey: dummy-key-invalid
          inputFiles: '/tmp/sample.md'
          outputFiles: '/tmp/sample.ja.md'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed at API call (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is invalid,
          # but it should NOT fail due to input validation errors.
          # Either failure (API error) or success is acceptable here —
          # what matters is that the action did NOT fail with "Invalid input"
          # about file extensions (which would indicate a bug in input parsing).
          if [ "$OUTCOME" = "failure" ]; then
            echo "Action failed as expected (invalid API key causes API error)."
            echo "PASS"
          else
            echo "WARN: Action unexpectedly succeeded — possibly mocked or no API call made."
            echo "PASS"
          fi
