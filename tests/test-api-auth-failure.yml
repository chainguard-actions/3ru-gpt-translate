name: Test API authentication failure with valid inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid inputs but invalid API key
        id: action
        uses: .
        with:
          apikey: 'sk-invalid-fake-key-for-testing'
          provider: 'openai'
          model: 'gpt-4o'
          inputFiles: 'tests/fixtures/sample.md'
          outputFiles: 'tests/fixtures/sample.{ja}.md'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed due to API auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when API key is invalid"
