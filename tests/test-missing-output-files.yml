name: Test missing outputFiles and languages error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          apikey: fake-api-key-not-used
          inputFiles: 'README.md'
          outputFiles: ''
          languages: ''
        continue-on-error: true
      - name: Assert action failed with missing params error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when inputFiles is set but outputFiles/languages are missing"
            exit 1
          fi
          echo "PASS"
