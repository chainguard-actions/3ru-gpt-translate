name: Test missing outputFiles and languages causes error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a small markdown file
      - name: Create input markdown file
        run: |
          echo "# Hello World" > "$GITHUB_WORKSPACE/test-input.md"

      # When inputFiles is provided but outputFiles and languages are empty,
      # the action should fail with:
      # "Error: For push execution, all three parameters (inputFiles, outputFiles and language) are required"
      - id: action
        uses: .
        with:
          apikey: 'dummy-key-not-used'
          inputFiles: 'test-input.md'
          outputFiles: ''
          languages: ''
        continue-on-error: true

      - name: Assert action failed due to missing outputFiles and languages
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when outputFiles and languages are missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when outputFiles and languages are not provided"
