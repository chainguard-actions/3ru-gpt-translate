name: Test mismatched outputFiles and languages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with mismatched outputFiles and languages count
        id: action
        # outputFiles has 2 entries but languages has only 1 — should fail with
        # "Error: outputFiles and language must be same length."
        uses: .
        with:
          apikey: dummy-key-not-used
          inputFiles: 'README.md'
          outputFiles: 'README.ja.md README.zh.md'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed due to mismatched lengths
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when outputFiles and languages lengths differ, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected mismatched outputFiles and languages"
