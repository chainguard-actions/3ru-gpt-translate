name: Test mismatched outputFiles and languages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test markdown file
        run: |
          mkdir -p tests/fixtures
          echo "# Hello World" > tests/fixtures/sample.md

      - name: Run action with mismatched outputFiles and languages
        id: action
        uses: .
        with:
          apikey: 'sk-fake-key-for-mismatch-test'
          inputFiles: 'tests/fixtures/sample.md'
          outputFiles: 'tests/fixtures/sample.ja.md tests/fixtures/sample.fr.md'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed due to mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when outputFiles and languages counts differ, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on mismatched outputFiles/languages"
