name: Test with basePath input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          apikey: fake-api-key-not-used
          basePath: 'https://api.openai.com/v1'
          inputFiles: ''
          outputFiles: ''
          languages: ''
        continue-on-error: true
      - name: Assert action succeeded with basePath input (no files = skip)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when no inputFiles are specified (even with basePath set)"
            exit 1
          fi
          echo "PASS"
