name: Test no input files (skip translation)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no inputFiles
        id: action
        # When inputFiles is empty, the action logs "No input files specified. Skip translation."
        # and returns early without calling OpenAI — so a dummy apikey is sufficient.
        uses: .
        with:
          apikey: dummy-key-not-used
          inputFiles: ''
          outputFiles: ''
          languages: ''
        continue-on-error: true

      - name: Assert action did not fail
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (skip) when no inputFiles provided, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action skipped translation as expected"
