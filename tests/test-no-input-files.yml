name: Test no input files (skip translation)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no inputFiles
        id: action
        uses: .
        with:
          apikey: 'sk-fake-key-for-no-input-test'
          inputFiles: ''
          outputFiles: ''
          languages: ''
        continue-on-error: true

      - name: Assert action succeeded (no files = skip, not error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (skip) when no inputFiles provided, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action skipped translation gracefully"
