name: Test no input files (skip translation)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no inputFiles
        id: action
        uses: .
        with:
          apikey: dummy-key
          inputFiles: ''
          outputFiles: ''
          languages: ''
        # When inputFiles is empty, the action should log "No input files specified. Skip translation."
        # and exit 0 without making any API calls.

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with no input files."
          echo "PASS"
