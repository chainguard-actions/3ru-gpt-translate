name: Test GPT Translate - No Input Files (Skip)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: owner/repo
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no inputFiles are provided, the action should skip translation
      # and exit successfully without calling the OpenAI API.
      - id: action
        uses: .
        with:
          apikey: fake-api-key-not-used
          token: dummy-github-token
          # inputFiles intentionally omitted - triggers early exit path

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with no inputFiles specified."
          echo "PASS"
