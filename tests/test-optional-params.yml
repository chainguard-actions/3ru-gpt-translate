name: Test optional parameters (basePath, max_tokens, seed, systemPrompt)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          apikey: 'fake-api-key-for-testing'
          provider: 'openai'
          model: 'gpt-4o'
          basePath: 'http://localhost:19999/v1'
          max_tokens: '100'
          seed: '42'
          systemPrompt: 'You are a professional translator.'
          prompt: 'Please translate the given text into naturalistic {targetLanguage}.'
          inputFiles: 'hardened/tests/fixtures/sample.md'
          outputFiles: 'hardened/tests/fixtures/sample.ja.md'
          languages: 'ja'
          temperature: '0.3'
          top_p: '0.5'
          presence_penalty: '0'
          frequency_penalty: '0'
      - name: Assert action ran with optional params
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because we used a fake API key and
          # a non-existent basePath endpoint. What matters is that the action
          # was invoked with all the optional inputs (basePath, max_tokens,
          # seed, systemPrompt) without crashing on input parsing.
          # A connection-refused or auth error is acceptable; a crash on
          # missing/invalid input names is not.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
