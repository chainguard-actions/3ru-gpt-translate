name: Test model, prompt, and basePath inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy markdown file to translate
        run: |
          mkdir -p /tmp/translate-input
          echo "# Hello World" > /tmp/translate-input/README.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          apikey: "sk-fake-key-for-testing-model-prompt-basepath"
          model: "gpt-3.5-turbo"
          prompt: "Translate the following markdown to the target language."
          basePath: "https://invalid.example.com/v1"
          inputFiles: "README.md"
          outputFiles: "README.ja.md"
          languages: "ja"

      - name: Assert action ran with model, prompt, and basePath inputs accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the basePath is invalid and
          # the apikey is fake. What matters is that the inputs were accepted
          # (not rejected as unknown/invalid inputs) and the action attempted
          # to run. A failure due to API/network error is acceptable here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted model, prompt, and basePath inputs and ran"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
