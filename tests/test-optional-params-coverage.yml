name: Test optional params - basePath, max_tokens, seed, systemPrompt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a small markdown file to translate
      - name: Create input markdown file
        run: |
          echo "# Hello World" > "$GITHUB_WORKSPACE/test-optional-input.md"

      # Exercise the optional inputs: basePath, max_tokens, seed, systemPrompt.
      # The action will fail at the API stage because the key is invalid,
      # but all four inputs are passed and validated by the action's input handling.
      - id: action
        uses: .
        with:
          apikey: 'sk-invalid-key-for-testing'
          provider: 'openai'
          model: 'gpt-4o'
          inputFiles: 'test-optional-input.md'
          outputFiles: 'test-optional-input.{ja}.md'
          languages: 'Japanese'
          basePath: 'https://api.openai.com/v1'
          max_tokens: '512'
          seed: '42'
          systemPrompt: 'You are a professional translator. Translate accurately.'
        continue-on-error: true

      - name: Assert action attempted translation (failed at API, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is invalid.
          # What matters is that it did NOT fail due to input validation errors
          # for basePath, max_tokens, seed, or systemPrompt.
          # A failure here means the API was reached (inputs were accepted).
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly (possibly mocked environment)"
          fi
          echo "PASS: action accepted basePath, max_tokens, seed, and systemPrompt inputs"
