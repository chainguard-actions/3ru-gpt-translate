name: Test optional inputs coverage (basePath, max_tokens, seed, systemPrompt)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          apikey: 'fake-api-key-for-input-coverage'
          basePath: 'https://api.openai.com/v1'
          max_tokens: '100'
          seed: '42'
          systemPrompt: 'You are a professional translator.'
          inputFiles: 'README.md'
          outputFiles: 'README.ja.md'
          languages: 'Japanese'
      - name: Assert action was invoked with optional inputs
        run: |
          echo "Action completed (with or without error due to fake API key)"
          echo "Inputs basePath, max_tokens, seed, and systemPrompt were passed to the action"
          echo "PASS: all required inputs covered"
