name: Test optional inputs coverage (model, prompt, basePath, max_tokens, seed)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create input markdown file
        run: |
          mkdir -p /tmp/gpt-translate-test
          echo "# Hello World" > /tmp/gpt-translate-test/input.md

      - name: Run action with optional inputs (expect failure due to fake API key)
        id: action
        continue-on-error: true
        uses: .
        with:
          apikey: "sk-fake-key-for-input-coverage-testing"
          model: "gpt-3.5-turbo"
          prompt: "Translate the following markdown to the target language."
          basePath: "https://invalid.example.com/v1"
          max_tokens: "1024"
          seed: "42"
          top_p: "0.5"
          temperature: "0.3"
          n: "1"
          presence_penalty: "0"
          frequency_penalty: "0"
          inputFiles: "/tmp/gpt-translate-test/input.md"
          outputFiles: "/tmp/gpt-translate-test/output.md"
          languages: "ja"

      - name: Assert action ran (with or without error due to fake API key)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail due to invalid API key/basePath,
          # but we verify it was invoked with all the optional inputs.
          # A failure here means the action crashed before processing inputs.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with all optional inputs"
