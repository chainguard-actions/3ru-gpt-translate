name: Test - No Input Files Skip
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run GPT Translate with no inputFiles
        id: action
        # When inputFiles is empty, the action should skip translation and succeed
        # without making any API calls
        uses: .
        with:
          token: 'fake-token'
          apikey: 'fake-api-key-not-needed-when-no-files'
        continue-on-error: true

      - name: Assert action succeeded (skipped translation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (skip) when no inputFiles provided, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly skipped translation when no inputFiles provided"
