name: Test - Output Files Language Count Mismatch
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run GPT Translate with mismatched outputFiles and languages count
        id: action
        # When outputFiles has more entries than languages (or vice versa),
        # the action should fail with a length mismatch error.
        uses: .
        with:
          token: 'fake-token'
          apikey: 'fake-api-key'
          inputFiles: 'README.md'
          outputFiles: 'README.ja.md README.zh.md'
          languages: 'Japanese'
        continue-on-error: true

      - name: Assert action failed due to length mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when outputFiles and languages have different counts, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when outputFiles and languages counts do not match"
