name: Test GPT Translate - Missing Required Parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: owner/repo
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When inputFiles is provided but outputFiles and languages are omitted,
      # translateByManual throws "Error: For push execution, all three parameters
      # (inputFiles, outputFiles and language) are required".
      - id: action
        uses: .
        continue-on-error: true
        with:
          apikey: fake-api-key-not-used
          token: dummy-github-token
          inputFiles: README.md
          # outputFiles and languages intentionally omitted

      - name: Assert action failed due to missing required parameters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when outputFiles and languages are missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for missing outputFiles and languages"
